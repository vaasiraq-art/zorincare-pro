<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="55%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#07192F"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#00BBF9"/>
      <stop offset="100%" stop-color="#4361EE"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72EFDD"/>
      <stop offset="100%" stop-color="#00BBF9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" stroke="#1E3A5F" stroke-width="4"/>

  <!-- Shield Outline -->
  <path d="M128 42 L196 68 V126 C196 172 166 204 128 218 C90 204 60 172 60 126 V68 Z"
        fill="#0D1F3C" stroke="url(#ringGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner Speedometer Arc -->
  <path d="M84 152 A52 52 0 1 1 172 152"
        fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Center Lightning Bolt -->
  <path d="M136 82 L104 132 H128 L120 174 L154 122 H130 Z"
        fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
